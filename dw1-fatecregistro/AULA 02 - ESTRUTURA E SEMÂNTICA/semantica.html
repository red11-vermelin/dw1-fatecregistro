<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de site  com HTML semântico </title>
</head>
<body>
    <header>
        <h1>Portal de Noticias</h1>
    </header>
    <nav> 
        <a href="#"><p> Home</p></a>
        <a href="#"><p>Tecnologia</p></a>
        <a href="#"><p>Esportes</p></a>
        <a href="#"><p>Fazer Login</p></a>
    </nav>
    <!-- linha divisoria -->
    <hr>

    <!-- parte central -->
    <main>
        <!-- section= cria uma seção -->
        <section>
            <h2>Últimas Notícias </h2>
            <article>
                <h3> HTML ganha destaque</h3>
                <p>O HTML trouxe melhorias significativas para web. </p>
            </article>
            <article>
                <h3> CSS e Javascript</h3>
                <p>Tecnologias que tarbalham em conjunto com o HTML. </p>
            </article>
        </section>
        <hr>
        <!-- aside= conteúdo secúndario -->
        <aside>
            <h3>Anúncios</h3>
            <!-- strong deixa em negrito -->
             <p><strong>Espaço publicitário</strong></p>
        </aside>
    </main>
    <hr>
    <footer><em>&copy; 2026 - Portal de Notícias</em></footer>
</body>
</html>
