<!doctype html>

<html lang="pt-br">
  <!--lang informa o idioma do site -->
  <!-- Head irão as metatags ou informaçôes od site -->
  <head>
    <!-- charset indica o número de caracteres -->
    <meta charset="UTF-8" />
    <!-- Melhorar a visualização de dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título da barra do navegador -->
    <title>Meu Website</title>
  </head>
  <!-- O que o usuario irá ver -->
  <body>
    <h1>Meu site</h1>
    <p>Bem-vindo ao meu site</p>
  </body>
</html>
